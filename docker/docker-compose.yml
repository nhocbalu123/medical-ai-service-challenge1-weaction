version: "3.9"

services:
  # ── FastAPI API service ──────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: medical_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-medicaldb}
      MODEL_NAME: ${MODEL_NAME:-facebook/bart-large-mnli}
      MODEL_VERSION: ${MODEL_VERSION:-1.0.0}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - medical_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── PostgreSQL database ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: medical_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-medicaldb}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - medical_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medicaldb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pg_data:

networks:
  medical_net:
    driver: bridge
